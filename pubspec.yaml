name: flowmint_ai
description: "FLOWMINT AI â€” one AI assistant for every financial action."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  file_picker: ^13.3.3
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  pdf: ^3.12.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.4.0
  uuid: ^4.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# pdf caps archive below 4.1 and xml below 7, but newer image releases call ZLibDecoder.decodeLazy
# from newer archive releases and fails to compile. Remove once pdf allows
# archive >=4.1.
dependency_overrides:
  image: ">=4.1.0 <4.9.0"
